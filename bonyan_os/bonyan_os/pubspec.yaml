name: bonyan_os
description: "بنيان OS - المنظومة التعليمية المتكاملة"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── State Management ───────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  riverpod_annotation: ^2.3.5

  # ─── Firebase ────────────────────────────────────────────────────────────────
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_database: ^11.0.2        # Realtime DB → Cell-of-5 alarms
  firebase_messaging: ^15.0.3       # FCM push notifications
  cloud_functions: ^5.0.3           # Server-side privilege elevation
  firebase_storage: ^12.0.0

  # ─── AI / ML ─────────────────────────────────────────────────────────────────
  google_generative_ai: ^0.4.3      # Mueen AI core
  speech_to_text: ^6.6.0            # Lecture audio capture
  flutter_tts: ^4.0.2               # Arabic TTS responses

  # ─── Notifications & Alarms ──────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.1
  awesome_notifications: ^0.9.3+1   # Rich notifications with actions
  android_alarm_manager_plus: ^4.0.3
  workmanager: ^0.5.2               # Background task scheduling

  # ─── Location & Geofencing ───────────────────────────────────────────────────
  geolocator: ^12.0.0
  geofence_service: ^6.0.0+1
  
  google_maps_flutter: ^2.7.0

  # ─── Networking ──────────────────────────────────────────────────────────────
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  internet_connection_checker_plus: ^2.5.0

  # ─── QR Code ─────────────────────────────────────────────────────────────────
  mobile_scanner: ^5.2.1            # QR attendance scanning
  qr_flutter: ^4.1.0                # QR generation

  # ─── Charts & Analytics ──────────────────────────────────────────────────────
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^25.2.7

  # ─── UI / Design ─────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1              # Cairo font for Arabic
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_slidable: ^3.1.0
  percent_indicator: ^4.2.3
  fl_heatmap: ^0.0.3                # Prayer heatmap visualization
  confetti: ^0.7.0                  # Achievement celebrations

  # ─── Hive (local cache / offline) ────────────────────────────────────────────
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # ─── Security & Encryption ───────────────────────────────────────────────────
  encrypt: ^5.0.3                   # AES-256 for PII fields
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  pointycastle: ^3.9.1

  # ─── P2P / VOIP ──────────────────────────────────────────────────────────────
  agora_rtc_engine: ^6.3.2          # VOIP wake-up calls
  permission_handler: ^11.3.1

  # ─── Utilities ───────────────────────────────────────────────────────────────
  uuid: ^4.4.0
  intl: ^0.19.0                     # Arabic date/time formatting
  event_bus: ^2.0.0                 # Cross-module event system
  rxdart: ^0.28.0
  collection: ^1.18.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  logger: ^2.3.0
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.0
  local_auth: ^2.2.0                # Biometric unlock
  in_app_review: ^2.0.9
  timezone: ^0.9.4
  flutter_timezone: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.0
  hive_generator: ^2.0.1
  mocktail: ^1.0.4
  flutter_gen_runner: ^5.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/audio/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
